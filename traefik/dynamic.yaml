http:
  routers:
    dashboard:
      rule: "Host(`traefik.YOUR-DOMAIN`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
      tls:
        certResolver: letsencrypt

    ## EXAMPLE — Canary deployment (see examples/canary-deployment/README.md)
    ## Uncomment the block below and change YOUR-AB-TEST-DOMAIN:
    # app-ab-test-router:
    #   rule: "Host(`YOUR-AB-TEST-DOMAIN`)"
    #   entryPoints:
    #     - websecure
    #   service: app-wrr-service
    #   tls:
    #     certResolver: letsencrypt

    ## EXAMPLE — Sablier zero-scale (see examples/sablier-zero-scale/README.md)
    ## Uncomment the block below and change YOUR-DOMAIN:
    # whoami-sablier-router:
    #   rule: "Host(`YOUR-DOMAIN`)"
    #   entryPoints:
    #     - websecure
    #   service: whoami-sablier-service
    #   middlewares:
    #     - my-sablier
    #   tls:
    #     certResolver: letsencrypt

  services:
    ## EXAMPLE — Canary weighted round-robin (see examples/canary-deployment/README.md)
    ## Uncomment the block below:
    # app-wrr-service:
    #   weighted:
    #     services:
    #       - name: app-v1-service@docker
    #         weight: 9
    #       - name: app-v2-service@docker
    #         weight: 1

    ## EXAMPLE — Sablier service (see examples/sablier-zero-scale/README.md)
    ## Uncomment the block below:
    # whoami-sablier-service:
    #   loadBalancer:
    #     servers:
    #       - url: "http://whoami_sablier/"

  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$$apr1$$placeholder$$replace_with_your_htpasswd_hash"

    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        customResponseHeaders:
          server: ""

    test-ipallowlist:
      ipAllowList:
        sourceRange:
          - "YOUR_IP_ADDRESS"

    ## EXAMPLE — Sablier middleware (see examples/sablier-zero-scale/README.md)
    ## Uncomment the block below:
    # my-sablier:
    #   plugin:
    #     sablier:
    #       sablierUrl: "http://sablier:10000"
    #       sessionDuration: 1m
    #       names: whoami_sablier
    #       dynamic:
    #         displayName: "Save Your Resources!"
    #         refreshFrequency: 5s
    #         showDetails: "true"
    #         theme: ghost

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384
