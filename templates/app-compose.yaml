# Traefik Reverse Proxy - App Template
#
# HOW TO USE:
#   1. Copy this file to your app's directory as compose.yaml
#   2. Replace all CHANGE ME values (search for "CHANGE ME")
#   3. Add DNS A record in Cloudflare: SUBDOMAIN.yourdomain.com -> your VM IP (proxy OFF)
#   4. Run: docker compose up -d
#   5. SSL is automatic via Let's Encrypt
#
# TO REMOVE AN APP:
#   1. Run: docker compose down
#   2. Delete the app's directory
#   3. Remove the DNS record in Cloudflare
#
# TO UPDATE AN APP (new image version):
#   1. Edit compose.yaml with the new image
#   2. Run: docker compose pull && docker compose up -d
#
# OPTIONAL MIDDLEWARE:
#   Add security headers to your app (defined in traefik/dynamic.yaml):
#     - "traefik.http.routers.myapp.middlewares=security-headers@file"
#   Add rate limiting:
#     - "traefik.http.middlewares.myapp-ratelimit.ratelimit.average=10"
#     - "traefik.http.routers.myapp.middlewares=myapp-ratelimit"
#   Combine multiple middlewares (comma-separated):
#     - "traefik.http.routers.myapp.middlewares=security-headers@file,myapp-ratelimit"

services:
  myapp:                                # CHANGE ME: container name (lowercase, no spaces)
    image: nginx:alpine                 # CHANGE ME: your app's Docker image
    container_name: myapp               # CHANGE ME: same as service name
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router: tells Traefik which domain to route to this app
      - "traefik.http.routers.myapp.rule=Host(`app.yourdomain.com`)"      # CHANGE ME: subdomain + domain
      - "traefik.http.routers.myapp.entrypoints=websecure"
      - "traefik.http.routers.myapp.tls.certresolver=letsencrypt"
      # Service: tells Traefik which port your app listens on
      - "traefik.http.services.myapp.loadbalancer.server.port=80"          # CHANGE ME: your app's port
    networks:
      - traefik-network
    # Uncomment if your app needs environment variables:
    # environment:
    #   - DATABASE_URL=postgres://...
    #   - API_KEY=your-key
    # Uncomment if your app needs persistent storage:
    # volumes:
    #   - ./data:/app/data

networks:
  traefik-network:
    external: true
